<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tohirjon Usmonov — Shaxsiy Sayt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0d1015;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }
    /* Yuqori menyu (Navbar) */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: #fff;
      color: #0d1015;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-links a {
      color: #9ca3af;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s;
    }
    .nav-links a:hover { color: #fff; }

    /* Asosiy qism (Hero) */
    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 40px;
      padding: 60px 0;
    }
    .hero h1 {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
      text-transform: uppercase;
    }
    .hero p {
      color: #9ca3af;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
      max-width: 480px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: #141820;
      border: 1px solid #2d333f;
      border-radius: 10px;
      padding: 12px 16px;
      max-width: 440px;
      margin-bottom: 24px;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      width: 100%;
      font-size: 14px;
      margin-left: 10px;
    }

    /* Saytlar tugmalari va logotiplari */
    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      max-width: 500px;
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      transition: 0.2s;
      border: 1px solid #374151;
      color: #ffffff;
      background: #141820;
    }
    .social-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      border-color: #ffffff;
    }
    .btn-gpt { background: #10a37f; border-color: #10a37f; color: #fff; }
    .btn-gpt:hover { background: #0d8a6a; }
    .btn-tg { background: #229ED9; border-color: #229ED9; color: #fff; }
    .btn-tg:hover { background: #1c88bc; }
    .btn-yt { background: #FF0000; border-color: #FF0000; color: #fff; }
    .btn-yt:hover { background: #cc0000; }
    .btn-tt { background: #000000; border-color: #25F4EE; color: #fff; box-shadow: -2px 0 0 #25F4EE, 2px 0 0 #FE2C55; }
    .btn-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); border-color: transparent; color: #fff; }

    /* O'ng tomondagi rasm (Glow effektli) */
    .hero-visual {
      display: flex;
      justify-content: center;
      position: relative;
    }
    .glow-circle {
      width: 310px;
      height: 310px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.28), inset 0 0 30px rgba(56, 189, 248, 0.3);
    }
    .glow-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Pastki kartalar (Featured Services) */
    .services {
      padding: 30px 0 70px;
    }
    .services h2 {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .service-card {
      background: #ffffff;
      color: #0d1015;
      border-radius: 16px;
      padding: 24px;
      transition: transform 0.2s;
    }
    .service-card:hover { transform: translateY(-4px); }
    .service-card h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }
    .service-card p {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.5;
    }

    /* Telefonga moslashuv */
    @media (max-width: 768px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 40px 0;
      }
      .hero h1 { font-size: 30px; }
      .hero p { margin: 0 auto 24px; }
      .search-box { margin: 0 auto 20px; }
      .btn-group { justify-content: center; margin: 0 auto; }
      .glow-circle { width: 240px; height: 240px; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
